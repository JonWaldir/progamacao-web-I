<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Formatação texto</title>
</head>
<body> bgcolor= "yellow"
   Negrito
   <br>
    <b> Negrito</b>
   <br>
   <strong>Negrito</strong>
   <hr>
   <!--italico-->
   Italíco <br>
   <i>Italíco</i>
   <br>
   <em>Italíco</em>
   <hr> 
   <!--subresescrito e subscrito-->
   x <sup>2</sup> <br>
   10 <sup>0</sup> celsius <br>
   log <sub>10</sub>
   <hr>
   <!--tamanho e letras-->
   Este e meu texto <small>qualquer</small> <br>
   <hr>
   <!--marcar o texto-->
   este e um o meu <mark> texto</mark>
</body>
</html>
