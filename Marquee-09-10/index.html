<!DOCTYPE html>
    <html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Marquee - Letreiro</title>
        <link rel="stylesheet" href="style.css">
        

    </head>

    <body>
        <h2>Teste alternate</h2>
        <marquee behavior="alternate">Etec ABH </marquee>
        <br>

        <h2>Teste slide</h2>
        <marquee behavior="slide">Etec ABH </marquee>
        <br>

        <h2>Teste scroll</h2>
        <marquee behavior="scroll">Etec ABH </marquee>
        <br>

        <h2>teste Scroolamount</h2>
        <marquee behavior="alternate" scrollamount="90">Etec ABH </marquee>
        <br>

        <h2>Teste de movvimento de cima para baixo</h2>
        <h3>pode se udar o behavior e direction e looping</h3>

        <marquee 
        scrollamount="10"
         direction="down"
        behavior="slide">Etec ABH </marquee>
        <marquee 
        scrollamount="10"
         direction="up"
         loop="2"
        behavior="slide">Etec ABH </marquee>
        
        
    </body>
</html>
